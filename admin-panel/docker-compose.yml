services:
  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-POSAssist_bot}
    image: support-admin:latest
    container_name: support_admin
    restart: unless-stopped
    ports:
      - "3001:3000"
