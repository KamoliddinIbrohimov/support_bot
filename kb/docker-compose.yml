services:
  kb-postgres:
    image: pgvector/pgvector:pg16
    container_name: kb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - "5433:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kb-api:
    build: .
    container_name: kb_api
    restart: unless-stopped
    depends_on:
      kb-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: kb-postgres
    ports:
      - "8100:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"

volumes:
  kb_postgres_data:
